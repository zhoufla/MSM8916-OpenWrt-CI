name: Build msm8916 (jz02v10 / sp970v11)

on:
  workflow_dispatch:
    inputs:
      model:
        description: '目标机型（both = 两个机型并行编译）'
        type: choice
        default: both
        options:
          - both
          - jz02v10
          - sp970v11
      release:
        description: '构建成功后创建 Release'
        type: boolean
        default: false
      tag:
        description: '手动创建 Release 用的 tag（留空则自动生成 build-<日期>-<短SHA>）'
        type: string
        required: false
        default: ''
      no_cache:
        description: '禁用构建缓存（怀疑缓存导致怪问题时勾选，跑一次干净构建）'
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * 6'   # 每周六 UTC 18:00（北京时间周日 02:00）跟一次上游
  push:
    tags: [ 'v*' ]

# 上游 pin 只在这里写一次：build.sh 读同名环境变量（脚本内的默认值只服务于本地直跑），
# 缓存 key 也引用它，升级上游只需改这一行。
env:
  IMMORTALWRT_REF: 89f1ef18c888f841633f19f92655ee4b7f7716a4

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # 机型过滤只能写在 matrix 里：job 级 if 在 matrix 展开之前求值，
      # 在那里引用 matrix.* 会被判为 Unrecognized named-value: 'matrix'，整个工作流直接无效。
      # 下面用 && / || 链按字符串分支（不依赖 inputs.model == '' 判等，
      # 定时 / tag 触发时 inputs 上下文为空，判等结果不可靠）。
      # 未选或选 both -> 两机型并行；选单一机型 -> 单元素矩阵。
      matrix:
        model: ${{ fromJSON(inputs.model == 'jz02v10' && '["jz02v10"]' || inputs.model == 'sp970v11' && '["sp970v11"]' || '["jz02v10","sp970v11"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget curl \
            ccache cmake cpio python3 python3-pip python3-setuptools swig bc time \
            qemu-utils genisoimage vim xxd libelf-dev subversion xz-utils

      # ---------------------------------------------------------------- 缓存
      # 只缓存两类"纯输入侧"数据，都不参与正确性判断，还原旧了最多是缓存不命中：
      #   dl/       make download 抓的源码 tarball，命中即省 1~2GB 下载（约 5~15 分钟）
      #   .ccache   ccache 对象缓存（CONFIG_CCACHE=y 已在 configs/*.diffconfig 开启）
      # 刻意不缓存 staging_dir / build_dir：它们与 .config 的 mtime、中间 stamp 强绑定，
      # 跨版本还原可能让 make 跳过该重建的步骤、产出脏固件，风险不值得。
      #
      # 注：if 用 !inputs.no_cache 而不是 inputs.use_cache != false —— 定时 / tag 触发时
      # inputs 上下文为空（null），null 与 false 在表达式里会被同时转成 0 而"相等"，
      # 那种写法会让定时构建悄悄丢掉缓存。! 走的是真值判断，null 为 falsy，行为确定。
      - name: 恢复源码下载缓存（dl）
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v4
        with:
          path: workspace/openwrt/dl
          # 换上游 pin、改 feeds、改 build.sh 都会换 key；旧 key 由 cleanup 工作流回收。
          # dl 是按文件名+哈希取用的，restore-keys 命中旧包不会污染构建。
          key: dl-v1-${{ env.IMMORTALWRT_REF }}-${{ hashFiles('configs/feeds.conf', 'build.sh') }}
          restore-keys: |
            dl-v1-${{ env.IMMORTALWRT_REF }}-
            dl-v1-

      - name: 恢复 ccache
        if: ${{ !inputs.no_cache }}
        uses: actions/cache@v4
        with:
          path: workspace/openwrt/.ccache
          # ccache 按内容哈希命中，还原到"配置有差异"的缓存也不会用错对象，
          # 所以存在性不影响正确性，key 只决定回收粒度。按机型分开存，
          # 避免两个并行 job 抢同一个 key（同一 key 只有一个能写入）。
          key: ccache-v1-${{ env.IMMORTALWRT_REF }}-${{ hashFiles('configs/*.diffconfig', 'build.sh', 'files/**') }}-${{ matrix.model }}
          # 两个机型共用绝大部分目标文件，首次跑另一机型时先借对方的缓存。
          restore-keys: |
            ccache-v1-${{ env.IMMORTALWRT_REF }}-${{ hashFiles('configs/*.diffconfig', 'build.sh', 'files/**') }}-
            ccache-v1-${{ env.IMMORTALWRT_REF }}-

      - name: 构建固件
        env:
          MODEL: ${{ matrix.model }}
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PSK: ${{ secrets.WIFI_PSK }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          LAN_IP: ${{ secrets.LAN_IP }}
          # ccache 上限：不设的话默认 5G，两个机型的缓存会撑爆仓库 10G 配额。
          # 上游 rules.mk 只导出 NOCOMPRESS/BASEDIR/DIR，这两个变量不会被覆盖。
          CCACHE_MAXSIZE: 2G
          # 关键：工具链每轮都重建，cc 二进制的 mtime 必然变化，默认的
          # mtime,size 校验会让整份缓存 100% 失效。pin 不变 => 编译器不变，
          # 改用固定字符串校验，缓存才能跨 run 复用（代价是编译器换了也看不出来，
          # 但换 pin 会同时换缓存 key，二者绑在一起）。
          CCACHE_COMPILERCHECK: string:immortalwrt-${{ env.IMMORTALWRT_REF }}
        run: ./build.sh

      - name: ccache 命中统计
        if: always()
        continue-on-error: true
        run: |
          B="$PWD/workspace/openwrt/staging_dir/host/bin/ccache"
          [ -x "$B" ] || { echo "ccache 未构建（构建未走到工具链阶段），跳过"; exit 0; }
          CCACHE_DIR="$PWD/workspace/openwrt/.ccache" "$B" -s -v | head -25
          du -sh "$PWD/workspace/openwrt/.ccache" || true

      - name: 校验产物无隐私残留
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PSK: ${{ secrets.WIFI_PSK }}
        run: |
          D=workspace/openwrt/bin/targets/msm89xx/msm8916
          ok=1
          if [ -n "$WIFI_PSK" ] && grep -rqF -- "$WIFI_PSK" "$D"; then
            echo "::error::产物含 WiFi 密码"; ok=0
          fi
          if [ -n "$WIFI_SSID" ] && grep -rqF -- "$WIFI_SSID" "$D"; then
            echo "::error::产物含 SSID"; ok=0
          fi
          if grep -rq "@WIFI_SSID@\|@WIFI_PSK@\|@ROOT_PASSWORD_HASH@" "$D"; then
            echo "::error::产物残留未渲染占位符"; ok=0
          fi
          [ "$ok" = 1 ] && echo "隐私检查通过"

      - name: 上传固件（artifact，保留 14 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-firmware
          path: |
            workspace/openwrt/bin/targets/msm89xx/msm8916/*.img
            workspace/openwrt/bin/targets/msm89xx/msm8916/*.bin
            workspace/openwrt/bin/targets/msm89xx/msm8916/*.manifest
            workspace/openwrt/bin/targets/msm89xx/msm8916/sha256sums
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release }}
    runs-on: ubuntu-24.04
    # 显式声明写权限：创建 Release / tag 需要 contents: write，
    # 不依赖仓库默认的 GITHUB_TOKEN 权限设置。
    permissions:
      contents: write
    steps:
      - name: 汇总各机型产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物（合并两机型，sha256sums 按机型改名避免重名）
        run: |
          mkdir -p rel
          find artifacts -type f \( -name '*.img' -o -name '*sysupgrade.bin' \) -exec cp {} rel/ \;
          for d in artifacts/*/; do
            m=$(basename "$d" -firmware)
            [ -f "$d/sha256sums" ] && cp "$d/sha256sums" "rel/sha256sums-${m}.txt"
          done
          ls -lh rel/

      # action-gh-release 在非 tag 的 ref 上必须显式提供 tag_name，否则直接报
      # "GitHub Releases requires a tag"（workflow_dispatch 的 ref 是 refs/heads/main）。
      # tag 推送 -> 用该 tag；手动触发且填了 tag -> 用填的；否则自动生成 build-<日期>-<短SHA>。
      - name: 决定 Release 标签
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: 创建 Release（tag / 手动勾选时）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # tag 不存在时由 API 在指定提交上创建，避免打到已前移的分支 HEAD
          target_commitish: ${{ github.sha }}
          # 手动 / 定时构建的 build-* 标记为预发布，不抢占 v* 正式 tag 的 Latest
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            rel/*.img
            rel/*sysupgrade.bin
            rel/sha256sums-*.txt
          body: |
            jz02v10 (Zhihe jz02-v10) + sp970v11 (GeXing SP970-V11, MSM8916) 自动构建
            - ImmortalWrt 89f1ef18c8 / msm89xx target
            - 基带：项目内置原厂固件（firmware/<model>/，来源 qcom-firmware）
            - 含 SMSRelay 短信网关、LTE 保活、LuCI 嵌入
            - sha256sums-<model>.txt 为对应机型产物的校验和
          generate_release_notes: true
