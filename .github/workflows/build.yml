name: Build msm8916 (jz02v10 / sp970v11)

on:
  workflow_dispatch:
    inputs:
      model:
        description: '目标机型（both = 两个机型并行编译）'
        type: choice
        default: both
        options:
          - both
          - jz02v10
          - sp970v11
      release:
        description: '构建成功后创建 Release'
        type: boolean
        default: false
      tag:
        description: '手动创建 Release 用的 tag（留空则自动生成 build-<日期>-<短SHA>）'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 18 * * 6'   # 每周六 UTC 18:00（北京时间周日 02:00）跟一次上游
  push:
    tags: [ 'v*' ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # 机型过滤只能写在 matrix 里：job 级 if 在 matrix 展开之前求值，
      # 在那里引用 matrix.* 会被判为 Unrecognized named-value: 'matrix'，整个工作流直接无效。
      # 下面用 && / || 链按字符串分支（不依赖 inputs.model == '' 判等，
      # 定时 / tag 触发时 inputs 上下文为空，判等结果不可靠）。
      # 未选或选 both -> 两机型并行；选单一机型 -> 单元素矩阵。
      matrix:
        model: ${{ fromJSON(inputs.model == 'jz02v10' && '["jz02v10"]' || inputs.model == 'sp970v11' && '["sp970v11"]' || '["jz02v10","sp970v11"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -y install build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget curl \
            ccache cmake cpio python3 python3-pip python3-setuptools swig bc time \
            qemu-utils genisoimage vim xxd libelf-dev subversion xz-utils

      - name: 构建固件
        env:
          MODEL: ${{ matrix.model }}
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PSK: ${{ secrets.WIFI_PSK }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          LAN_IP: ${{ secrets.LAN_IP }}
        run: ./build.sh

      - name: 校验产物无隐私残留
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PSK: ${{ secrets.WIFI_PSK }}
        run: |
          D=workspace/openwrt/bin/targets/msm89xx/msm8916
          ok=1
          if [ -n "$WIFI_PSK" ] && grep -rqF -- "$WIFI_PSK" "$D"; then
            echo "::error::产物含 WiFi 密码"; ok=0
          fi
          if [ -n "$WIFI_SSID" ] && grep -rqF -- "$WIFI_SSID" "$D"; then
            echo "::error::产物含 SSID"; ok=0
          fi
          if grep -rq "@WIFI_SSID@\|@WIFI_PSK@\|@ROOT_PASSWORD_HASH@" "$D"; then
            echo "::error::产物残留未渲染占位符"; ok=0
          fi
          [ "$ok" = 1 ] && echo "隐私检查通过"

      - name: 上传固件（artifact，保留 14 天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-firmware
          path: |
            workspace/openwrt/bin/targets/msm89xx/msm8916/*.img
            workspace/openwrt/bin/targets/msm89xx/msm8916/*.bin
            workspace/openwrt/bin/targets/msm89xx/msm8916/*.manifest
            workspace/openwrt/bin/targets/msm89xx/msm8916/sha256sums
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release }}
    runs-on: ubuntu-24.04
    # 显式声明写权限：创建 Release / tag 需要 contents: write，
    # 不依赖仓库默认的 GITHUB_TOKEN 权限设置。
    permissions:
      contents: write
    steps:
      - name: 汇总各机型产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物（合并两机型，sha256sums 按机型改名避免重名）
        run: |
          mkdir -p rel
          find artifacts -type f \( -name '*.img' -o -name '*sysupgrade.bin' \) -exec cp {} rel/ \;
          for d in artifacts/*/; do
            m=$(basename "$d" -firmware)
            [ -f "$d/sha256sums" ] && cp "$d/sha256sums" "rel/sha256sums-${m}.txt"
          done
          ls -lh rel/

      # action-gh-release 在非 tag 的 ref 上必须显式提供 tag_name，否则直接报
      # "GitHub Releases requires a tag"（workflow_dispatch 的 ref 是 refs/heads/main）。
      # tag 推送 -> 用该 tag；手动触发且填了 tag -> 用填的；否则自动生成 build-<日期>-<短SHA>。
      - name: 决定 Release 标签
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="build-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: 创建 Release（tag / 手动勾选时）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # tag 不存在时由 API 在指定提交上创建，避免打到已前移的分支 HEAD
          target_commitish: ${{ github.sha }}
          # 手动 / 定时构建的 build-* 标记为预发布，不抢占 v* 正式 tag 的 Latest
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: |
            rel/*.img
            rel/*sysupgrade.bin
            rel/sha256sums-*.txt
          body: |
            jz02v10 (Zhihe jz02-v10) + sp970v11 (GeXing SP970-V11, MSM8916) 自动构建
            - ImmortalWrt 89f1ef18c8 / msm89xx target
            - 基带：项目内置原厂固件（firmware/<model>/，来源 qcom-firmware）
            - 含 SMSRelay 短信网关、LTE 保活、LuCI 嵌入
            - sha256sums-<model>.txt 为对应机型产物的校验和
          generate_release_notes: true
